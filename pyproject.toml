[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2patent"
version = "0.1.0"
description = "Bridge agent: engineering simulation results (CSV/JSON) -> invention analysis -> technical disclosure handoff for a patent agent"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["agent", "simulation", "patent", "invention-disclosure", "llm", "deepseek", "bridge"]
authors = [{ name = "sim2patent contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "build>=1.0",
]

[project.scripts]
sim2patent = "sim2patent.cli:main"

[project.urls]
Homepage = "https://github.com/sim2patent/sim2patent"
Source = "https://github.com/sim2patent/sim2patent"
Issues = "https://github.com/sim2patent/sim2patent/issues"

[tool.setuptools.packages.find]
include = ["sim2patent*"]

[tool.setuptools.package-data]
sim2patent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
# 只启用能暴露真实问题的规则:未定义名/未用导入(F)、
# 语法与缩进(E9)、语句/导入类基础错误(E4/E7)
lint.select = ["E4", "E7", "E9", "F"]
lint.ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
